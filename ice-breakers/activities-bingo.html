<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Let's Make Plans! • Activity Bingo</title><style>*{box-sizing:border-box}body{margin:0;background:#f3efff;color:#27204c;font-family:Arial,sans-serif}main{max-width:960px;margin:auto;padding:28px 18px}header{text-align:center}small{font-weight:bold;letter-spacing:3px;color:#7356d8}h1{font-size:clamp(32px,6vw,55px);margin:12px 0}h1 span{color:#e14d8a}p{line-height:1.5}.tips{background:white;border-radius:20px;padding:16px 22px;margin:22px 0;box-shadow:0 5px 0 #ded5f8}.example{color:#6b3ac6;font-weight:bold}.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0}button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 18px;font-weight:bold;background:#6640cf;color:white}button.secondary{background:white;color:#6640cf}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.tile{position:relative;min-height:130px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;padding:14px 7px;border:3px solid transparent;background:var(--bg);color:#292148;border-radius:19px;box-shadow:0 5px 0 #33215c16;transition:transform .15s}.tile:hover{transform:translateY(-3px)}.emoji{font-size:36px}.tile.marked{border-color:#6536c8;box-shadow:inset 0 0 0 3px white}.tile.marked:after{content:'✓';position:absolute;right:7px;top:5px;background:#6536c8;color:white;border-radius:50%;width:24px;height:24px;line-height:24px}#status{text-align:center;min-height:30px;font-weight:bold;font-size:20px;margin:24px 0 10px}.caller{background:#29204d;color:white;padding:20px;border-radius:20px;text-align:center;margin-top:24px}.caller button{background:#ffc65c;color:#30234d}#call{font-size:23px;margin:14px 0}footer{text-align:center;font-size:13px;padding-top:22px;color:#6b6382}@media(max-width:520px){.grid{gap:7px}.tile{min-height:106px;font-size:12px;border-radius:13px}.emoji{font-size:28px}main{padding:22px 10px}}@media print{.controls,.caller,footer{display:none}.tile{box-shadow:none;min-height:110px;print-color-adjust:exact}body{background:white}}
#celebration{position:fixed;inset:0;z-index:20;background:#221044bb;display:none;align-items:center;justify-content:center;flex-direction:column;backdrop-filter:blur(5px)}#celebration.show{display:flex}#celebration h2{font-size:clamp(65px,17vw,170px);margin:0;color:#fff36a;text-shadow:5px 6px 0 #e63b9d;animation:pop .7s cubic-bezier(.2,1.7,.5,1) both;letter-spacing:6px}#celebration p{font-size:28px;color:white}#celebration button{background:white;color:#6832c5;z-index:22}#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:21}@keyframes pop{from{transform:scale(.1) rotate(-18deg);opacity:0}to{transform:scale(1) rotate(-4deg);opacity:1}}.tile.marked{background:#bcf4dd;transform:scale(.96)}
</style><main><header><small>SPEAK • PLAY • CONNECT</small><h1>Activity <span>Bingo!</span> 🎉</h1></header><div class="controls"><button id="new">🎲 New card</button><button class="secondary" id="clear">↺ Clear marks</button><button class="secondary" onclick="window.print()">🖨 Print card</button></div><div class="grid" id="board"></div><div id="status" role="status" aria-live="polite"></div><section class="caller"><strong>Need an invitation idea?</strong><div id="call" aria-live="polite">Pick a surprise activity!</div><button id="draw">✨ Surprise invitation</button><p id="remaining"></p></section></main><div id="celebration" role="dialog" aria-modal="true" aria-label="Bingo celebration"><h2>BINGO!</h2><p>🎉 You did it! 🎉</p><button id="continue">Keep playing ✨</button></div><canvas id="confetti" aria-hidden="true"></canvas><script>
const activities=[['🎬','go to the movies'],['☕','have a coffee'],['🧺','have a picnic'],['🎲','play board games'],['🍕','eat pizza'],['🏊','go swimming'],['🎤','sing karaoke'],['💃','go dancing'],['🚶','go for a walk'],['🚲','ride bikes'],['🍳','cook dinner'],['🛍️','go shopping'],['🎮','play video games'],['⚽','play soccer'],['📸','take photos'],['🏖️','go to the beach'],['🌳','visit a park'],['🍦','get ice cream'],['🎨','paint a picture'],['🎳','go bowling'],['🥾','go hiking'],['🎵','listen to music'],['🍽️','go out for dinner'],['🏛️','visit a museum']];let card=[],marks=new Set(),deck=[],won=false;const board=document.getElementById('board'),status=document.getElementById('status');const colors=['#ffe2ed','#dbf4ed','#fff0c8','#e4defc','#dcefff','#ffe3d0'];function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function check(){let lines=[];for(let i=0;i<4;i++){lines.push([0,1,2,3].map(j=>i*4+j));lines.push([0,1,2,3].map(j=>j*4+i))}lines.push([0,5,10,15],[3,6,9,12]);let next=lines.some(l=>l.every(i=>marks.has(i)));if(next&&!won)celebrate();won=next;status.textContent=won?'🎉 BINGO!':marks.size+' / 16 activities marked'}function render(){board.innerHTML='';card.forEach((a,i)=>{let b=document.createElement('button');b.className='tile'+(marks.has(i)?' marked':'');b.style.setProperty('--bg',colors[i%colors.length]);b.setAttribute('aria-pressed',marks.has(i));b.innerHTML='<span class="emoji">'+a[0]+'</span><span>'+a[1]+'</span>';b.onclick=()=>{marks.has(i)?marks.delete(i):marks.add(i);render();check()};board.append(b)})}function fresh(){card=shuffle(activities).slice(0,16);marks.clear();won=false;deck=shuffle(activities);render();check();document.getElementById('call').textContent='Pick a surprise activity!';document.getElementById('remaining').textContent=''}document.getElementById('new').onclick=()=>{if(marks.size&&!confirm('Start a new card and clear your marks?'))return;fresh()};document.getElementById('clear').onclick=()=>{marks.clear();render();check()};document.getElementById('draw').onclick=()=>{if(!deck.length){deck=shuffle(activities)}let a=deck.pop();document.getElementById('call').textContent=a[0]+' Would you like to '+a[1]+'?';document.getElementById('remaining').textContent=deck.length+' invitations left in this round'};const overlay=document.getElementById('celebration'),canvas=document.getElementById('confetti'),ctx=canvas.getContext('2d');let particles=[],frame=0,stopAt=0,lastFocus;function resize(){canvas.width=innerWidth;canvas.height=innerHeight}addEventListener('resize',resize);resize();function celebrate(){lastFocus=document.activeElement;overlay.classList.add('show');document.getElementById('continue').focus();particles=Array.from({length:230},()=>({x:Math.random()*canvas.width,y:-Math.random()*canvas.height,vx:(Math.random()-.5)*7,vy:2+Math.random()*5,r:Math.random()*6+5,a:Math.random()*6,c:['#ffdf42','#ff599b','#8a68ff','#53e5cb','#ffffff','#ff9a41'][Math.floor(Math.random()*6)]}));stopAt=performance.now()+9000;cancelAnimationFrame(frame);animate()}function animate(){ctx.clearRect(0,0,canvas.width,canvas.height);for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.a+=.05;if(p.y>canvas.height+20){p.y=-20;p.x=Math.random()*canvas.width}ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*.55);ctx.restore()}if(performance.now()<stopAt)frame=requestAnimationFrame(animate);else ctx.clearRect(0,0,canvas.width,canvas.height)}function closeParty(){overlay.classList.remove('show');cancelAnimationFrame(frame);ctx.clearRect(0,0,canvas.width,canvas.height);if(lastFocus)lastFocus.focus()}document.getElementById('continue').onclick=closeParty;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeParty();if(e.key==='Tab'&&overlay.classList.contains('show')){e.preventDefault();document.getElementById('continue').focus()}});fresh();
</script></html>

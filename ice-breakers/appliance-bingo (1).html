<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Appliance Bingo</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111331;color:#fff;font-family:system-ui,sans-serif;background-image:radial-gradient(ellipse at top left,#383379,transparent 65%);min-height:100vh}main{max-width:1180px;margin:auto;padding:26px}header{display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:clamp(32px,5vw,56px);margin:5px 0;letter-spacing:-2px}h1 span{color:#63eadb}.eyebrow{color:#b9b3ff;letter-spacing:3px;font-size:12px;font-weight:800}p{color:#c4c7e5}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:14px;font-weight:750;padding:13px 18px;background:#6557ee;color:white;transition:transform .15s}button:hover{transform:translateY(-2px)}button:focus-visible,input:focus-visible{outline:3px solid #ffcc63;outline-offset:3px}button:disabled{opacity:.5;cursor:default}input{width:160px;border:1px solid #5b5983;border-radius:12px;padding:12px;background:#222440;color:white}.layout{display:grid;grid-template-columns:1.5fr 1fr;gap:24px;margin-top:24px}.panel{background:#1c1e40;border:1px solid #414369;border-radius:25px;padding:23px;box-shadow:0 18px 60px #0003}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}.small{font-size:13px;color:#babee0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.cell{padding:12px 5px;min-height:112px;background:#2e315c;border:2px solid #484c7a;color:#fff;font-size:clamp(12px,1.6vw,16px);position:relative}.cell .icon{display:block;font-size:29px;margin-bottom:8px}.cell.marked{background:#135e62;border-color:#63eadb}.cell.marked:after{content:'✓';position:absolute;top:4px;right:7px;color:#8fffe9}.cell.win{background:#775006;border-color:#ffd36d}.call{background:#292657;border:1px solid #65609c;border-radius:20px;padding:25px 12px;text-align:center;margin:18px 0}.call strong{display:block;font-size:28px;min-height:70px;display:grid;place-items:center}.primary{background:#63eadb;color:#11383e;width:100%;font-size:19px}.history{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.chip{font-size:12px;padding:7px 10px;background:#32345d;border-radius:20px}.subbuttons{display:flex;gap:8px;margin-top:10px}.subbuttons button{flex:1;background:#37395f;font-size:13px}#status{min-height:26px;color:#ffd36d;font-weight:750;margin-top:16px}#banner{font-size:20px;color:#7ef1df;font-weight:800;min-height:30px;margin-top:14px}canvas{position:fixed;inset:0;pointer-events:none;z-index:5}label{font-size:13px;color:#d2d4ee}.count{background:#37305e;padding:8px 12px;border-radius:20px;color:#ddd5ff}.hint{font-size:13px;line-height:1.6}h2{font-size:19px;margin:0}details{margin-top:18px;color:#c5c9e8;font-size:13px}summary{cursor:pointer}@media(max-width:780px){.layout{grid-template-columns:1fr}main{padding:16px}.panel{padding:16px}header{align-items:start;flex-direction:column}.cell{min-height:100px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
#celebration:not([hidden]){position:fixed;inset:0;z-index:4;display:grid;place-items:center;background:#10122bc9;cursor:pointer}#celebration>div{text-align:center;font-size:clamp(42px,10vw,110px);font-weight:950;color:#ffdb7c;text-shadow:0 6px 0 #7d4999}#celebration small{display:block;font-size:22px;color:white;text-shadow:none;margin-top:20px}</style>
<main><header><div><div class="eyebrow">LISTEN • FIND • CONNECT</div><h1>Appliance <span>Bingo!</span></h1><p>A house full of words. A card full of possibilities.</p></div><button id="fullscreen">⛶ Full screen</button></header>
<div class="layout" style="display:block;max-width:800px;margin:24px auto"><section class="panel"><div class="toolbar"><div><label for="name">Your name</label><br><input id="name" placeholder="Player" maxlength="35"></div><button id="new">↻ New card</button></div><div class="grid" id="board" aria-label="Bingo card"></div><div id="banner" role="status" aria-live="polite"></div><p class="hint">Tap a word when you hear it. Complete a row, column, or diagonal to get BINGO!</p><div id="status" role="status" aria-live="polite"></div></section>
</div></main><div id="celebration" hidden role="status" onclick="this.hidden=true"><div>🎉 BINGO! 🎉<small>You completed a line!</small></div></div><canvas id="confetti"></canvas>
<script>
const words=['a food processor','a hair dryer','a pressure cooker','a dishwasher','a coffee maker','a rice cooker','a fan','a stove','an oven','a juicer','a washing machine','a dryer','a blender','a freezer','a refrigerator / a fridge','an air-conditioner','a vacuum cleaner'];
const icons=['🥕','💨','🍲','🍽️','☕','🍚','🌀','🔥','🥧','🍊','🫧','👕','🥤','🧊','❄️','🌬️','🧹'];
const $=id=>document.getElementById(id);let card=[],marked=new Set(),called=[],remaining=[],celebrated=new Set();
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function newCard(){$('celebration').hidden=true;clearTimeout(window.bingoTimer);card=shuffle(words.map((_,i)=>i)).slice(0,16);marked.clear();celebrated.clear();$('board').replaceChildren();card.forEach((w,i)=>{let b=document.createElement('button');b.className='cell';b.setAttribute('aria-pressed','false');let icon=document.createElement('span');icon.className='icon';icon.textContent=icons[w];icon.setAttribute('aria-hidden','true');b.append(icon,document.createTextNode(words[w]));b.onclick=()=>{marked.has(i)?marked.delete(i):marked.add(i);b.classList.toggle('marked',marked.has(i));b.setAttribute('aria-pressed',String(marked.has(i)));$('status').textContent='';check(false)};$('board').append(b)});$('banner').textContent='';$('status').textContent=''}
const lines=[];for(let r=0;r<4;r++)lines.push([0,1,2,3].map(c=>4*r+c));for(let c=0;c<4;c++)lines.push([0,1,2,3].map(r=>4*r+c));lines.push([0,5,10,15],[3,6,9,12]);
function check(manual){let wins=lines.filter(l=>l.every(i=>marked.has(i)));let cells=$('board').children;for(let i=0;i<16;i++)cells[i].classList.toggle('win',wins.some(l=>l.includes(i)));if(wins.length){$('banner').textContent='BINGO! '+($('name').value.trim()||'Player')+' 🎉';$('status').textContent=wins.length+' completed line'+(wins.length===1?'':'s')+'! Great job!';let fresh=wins.some(l=>!celebrated.has(l.join(',')));wins.forEach(l=>celebrated.add(l.join(',')));if(fresh){confetti();$('celebration').hidden=false;clearTimeout(window.bingoTimer);window.bingoTimer=setTimeout(()=>$('celebration').hidden=true,4000)}}else{$('banner').textContent='';if(manual)$('status').textContent='Keep going! Complete four squares in a line.'}}
let animation;function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;cancelAnimationFrame(animation);const cv=$('confetti'),ctx=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;let p=Array.from({length:150},()=>({x:Math.random()*cv.width,y:-Math.random()*cv.height,v:3+Math.random()*5,a:Math.random()*6,color:['#63eadb','#ffd36d','#ab8cff','#ff7cbc'][Math.floor(Math.random()*4)]}));let start=performance.now();function frame(t){ctx.clearRect(0,0,cv.width,cv.height);p.forEach(q=>{q.y+=q.v;q.x+=Math.sin(q.a+=.04)*2;ctx.fillStyle=q.color;ctx.save();ctx.translate(q.x,q.y);ctx.rotate(q.a);ctx.fillRect(-4,-4,8,12);ctx.restore()});if(t-start<4500)animation=requestAnimationFrame(frame);else ctx.clearRect(0,0,cv.width,cv.height)}animation=requestAnimationFrame(frame)}
$('new').onclick=()=>{if(marked.size&&!confirm('Create a new card and clear your marks?'))return;newCard()};$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{}};newCard();
</script></html>
